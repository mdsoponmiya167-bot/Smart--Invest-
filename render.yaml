services:
  - type: web
    name: smart-invest-api
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SSL_MODE
        value: sandbox
      - key: ENABLE_WALLET_CREDIT
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: smart-invest-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: BASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SSLCOMMERZ_STORE_ID
        sync: false
      - key: SSLCOMMERZ_STORE_PASSWORD
        sync: false
databases:
  - name: smart-invest-db
    plan: basic-256mb
